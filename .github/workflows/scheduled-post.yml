name: Carousel AI — scheduled post

# Render's free tier sleeps the instance after ~15 minutes idle, and a sleeping
# instance runs no in-process cron. This workflow is the reliable clock: it
# wakes the backend and triggers the pipeline every 6 hours (00/06/12/18 UTC),
# alternating tech and visa news slot by slot.
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: carousel-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BACKEND: https://twitter-viral-post.onrender.com
    steps:
      - name: Wake the Render instance
        # A cold start takes 30-60s; Render holds the request while it boots.
        run: |
          curl -sS --fail-with-body --retry 6 --retry-delay 15 --retry-all-errors \
               --max-time 120 "$BACKEND/api/health"
          echo

      - name: Record start time
        id: t
        run: echo "start=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" >> "$GITHUB_OUTPUT"

      - name: Trigger the pipeline
        run: |
          code=$(curl -sS -o /tmp/trigger.json -w '%{http_code}' \
            -X POST "$BACKEND/api/scheduler/trigger" \
            -H "x-trigger-secret: ${{ secrets.TRIGGER_SECRET }}" \
            --max-time 120)
          cat /tmp/trigger.json; echo
          if [ "$code" != "202" ]; then
            echo "::error::Trigger returned HTTP $code"
            exit 1
          fi

      - name: Wait for every account to finish
        # The trigger is fire-and-forget (a full run can outlast the proxy
        # timeout), so confirm the outcome by polling status.
        #
        # This waits for lastFanOut.finishedAt, NOT for the first post. Watching
        # lastResult would exit as soon as the first account published — and this
        # polling is what keeps a free-tier instance awake, so leaving early would
        # put it back to sleep with accounts still to run. That is the same shape
        # as the failure that silently stopped posting for six weeks.
        run: |
          START="${{ steps.t.outputs.start }}"
          for i in $(seq 1 60); do
            sleep 20
            curl -sS --max-time 60 "$BACKEND/api/scheduler/status" -o /tmp/status.json || continue

            done_at=$(jq -r '.lastFanOut.finishedAt // ""' /tmp/status.json)
            if [ -n "$done_at" ] && [ "$done_at" \> "$START" ]; then
              jq -r '.lastFanOut.results[] | "  \(.account): \(.outcome) \(.reason // .postId // "")"' /tmp/status.json
              posted=$(jq -r '.lastFanOut.posted // 0' /tmp/status.json)
              failed=$(jq -r '.lastFanOut.failed // 0' /tmp/status.json)
              echo "posted=$posted failed=$failed"
              # One account failing is worth a red run even when another posted:
              # a quietly dead handle otherwise looks identical to a healthy slot.
              if [ "$failed" -gt 0 ]; then
                echo "::error::$failed account(s) failed this slot."
                exit 1
              fi
              exit 0
            fi

            # A single-account trigger never sets lastFanOut, so fall back to the
            # per-run fields for that case.
            posted_at=$(jq -r '.lastResult.postedAt // ""' /tmp/status.json)
            failed_at=$(jq -r '.lastResult.failedAt // ""' /tmp/status.json)
            if [ -n "$failed_at" ] && [ "$failed_at" \> "$START" ]; then
              echo "::error::Pipeline failed: $(jq -r '.lastResult.error // "?"' /tmp/status.json)"
              exit 1
            fi
            echo "waiting... ($i/60)"
          done

          echo "::error::Timed out after 20 minutes with no completed fan-out."
          cat /tmp/status.json
          exit 1
