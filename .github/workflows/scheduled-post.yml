name: Carousel AI — scheduled post

# Render's free tier sleeps the instance after ~15 minutes idle, and a sleeping
# instance runs no in-process cron. This workflow is the reliable clock: it
# wakes the backend and triggers the pipeline every 6 hours (00/06/12/18 UTC),
# alternating tech and visa news slot by slot.
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      account:
        description: "Post now for these account slugs, comma-separated. Blank runs the ordinary due-slot fan-out."
        required: false
        default: ""

concurrency:
  group: carousel-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BACKEND: https://twitter-viral-post.onrender.com
    steps:
      - name: Wake the Render instance
        # A cold start takes 30-60s; Render holds the request while it boots.
        run: |
          curl -sS --fail-with-body --retry 6 --retry-delay 15 --retry-all-errors \
               --max-time 120 "$BACKEND/api/health"
          echo

      - name: Record start time
        id: t
        run: echo "start=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" >> "$GITHUB_OUTPUT"

      - name: Trigger the pipeline
        if: github.event.inputs.account == ''
        run: |
          code=$(curl -sS -o /tmp/trigger.json -w '%{http_code}' \
            -X POST "$BACKEND/api/scheduler/trigger" \
            -H "x-trigger-secret: ${{ secrets.TRIGGER_SECRET }}" \
            --max-time 120)
          cat /tmp/trigger.json; echo
          if [ "$code" != "202" ]; then
            echo "::error::Trigger returned HTTP $code"
            exit 1
          fi

      - name: Wait for every account to finish
        if: github.event.inputs.account == ''
        # The trigger is fire-and-forget (a full run can outlast the proxy
        # timeout), so confirm the outcome by polling status.
        #
        # This waits for lastFanOut.finishedAt, NOT for the first post. Watching
        # lastResult would exit as soon as the first account published — and this
        # polling is what keeps a free-tier instance awake, so leaving early would
        # put it back to sleep with accounts still to run. That is the same shape
        # as the failure that silently stopped posting for six weeks.
        run: |
          START="${{ steps.t.outputs.start }}"
          for i in $(seq 1 60); do
            sleep 20
            curl -sS --max-time 60 "$BACKEND/api/scheduler/status" -o /tmp/status.json || continue

            done_at=$(jq -r '.lastFanOut.finishedAt // ""' /tmp/status.json)
            if [ -n "$done_at" ] && [ "$done_at" \> "$START" ]; then
              jq -r '.lastFanOut.results[] | "  \(.account): \(.outcome) \(.reason // .postId // "")"' /tmp/status.json
              ran=$(jq -r '.lastFanOut.accounts // 0' /tmp/status.json)
              posted=$(jq -r '.lastFanOut.posted // 0' /tmp/status.json)
              failed=$(jq -r '.lastFanOut.failed // 0' /tmp/status.json)
              unrecorded=$(jq -r '.lastFanOut.unrecorded // 0' /tmp/status.json)
              echo "ran=$ran posted=$posted failed=$failed unrecorded=$unrecorded"

              # Nothing due is ordinary once accounts carry their own schedules:
              # a daily account is idle at three of the four slots. The backend
              # sets lastFanOut.error only when nothing ran for a reason worth
              # failing over — no active accounts, or a schedule that can never
              # coincide with this trigger.
              err=$(jq -r '.lastFanOut.error // ""' /tmp/status.json)
              if [ -n "$err" ]; then
                echo "::error::$err"
                jq -r '.lastFanOut.unreachable[]? | "  unreachable: " + .' /tmp/status.json
                exit 1
              fi
              if [ "$ran" -eq 0 ]; then
                echo "Nothing due this slot; $(jq -r '.lastFanOut.activeAccounts // 0' /tmp/status.json) active account(s) all reachable."
                exit 0
              fi
              # One account failing is worth a red run even when another posted:
              # a quietly dead handle otherwise looks identical to a healthy slot.
              if [ "$failed" -gt 0 ]; then
                echo "::error::$failed account(s) failed this slot."
                exit 1
              fi
              # Published but not recorded. The in-process stopgap covers the
              # rest of this fan-out and nothing more — it dies when the instance
              # sleeps or restarts, so the next slot can pick the same story
              # again. That needs someone to look at it, not a warning nobody
              # reads.
              if [ "$unrecorded" -gt 0 ]; then
                echo "::error::$unrecorded post(s) published but NOT recorded in the dedupe history — they can be reposted after a restart."
                jq -r '.lastFanOut.results[] | select(.recorded == false) | "  unrecorded: " + .account' /tmp/status.json
                exit 1
              fi
              exit 0
            fi

            # A single-account trigger never sets lastFanOut, so fall back to the
            # per-run fields for that case.
            posted_at=$(jq -r '.lastResult.postedAt // ""' /tmp/status.json)
            failed_at=$(jq -r '.lastResult.failedAt // ""' /tmp/status.json)
            if [ -n "$failed_at" ] && [ "$failed_at" \> "$START" ]; then
              echo "::error::Pipeline failed: $(jq -r '.lastResult.error // "?"' /tmp/status.json)"
              exit 1
            fi
            echo "waiting... ($i/60)"
          done

          echo "::error::Timed out after 20 minutes with no completed fan-out."
          cat /tmp/status.json
          exit 1
      - name: Post now for the named accounts
        if: github.event.inputs.account != ''
        # A slug named on the trigger runs that account directly, bypassing the
        # due-slot filter: the point of a manual release is that it is not a slot.
        # Accounts are done one at a time so the Groq per-minute budget still
        # covers each run, and each is confirmed before the next starts.
        env:
          ACCOUNTS: ${{ github.event.inputs.account }}
        run: |
          for slug in $(echo "$ACCOUNTS" | tr ',' ' '); do
            echo "::group::$slug"
            start=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
            code=$(curl -sS -o /tmp/trigger.json -w '%{http_code}'               -X POST "$BACKEND/api/scheduler/trigger"               -H "x-trigger-secret: ${{ secrets.TRIGGER_SECRET }}"               -H 'content-type: application/json'               -d "{\"account\":\"$slug\"}" --max-time 120)
            cat /tmp/trigger.json; echo
            if [ "$code" != "202" ]; then
              echo "::error::Trigger for $slug returned HTTP $code"
              exit 1
            fi

            # A single-account trigger sets lastResult, never lastFanOut.
            ok=""
            for i in $(seq 1 45); do
              sleep 20
              curl -sS --max-time 60 "$BACKEND/api/scheduler/status" -o /tmp/status.json || continue
              acct=$(jq -r '.lastResult.account // ""' /tmp/status.json)
              [ "$acct" = "$slug" ] || { echo "waiting... ($i/45)"; continue; }

              failed_at=$(jq -r '.lastResult.failedAt // ""' /tmp/status.json)
              if [ -n "$failed_at" ] && [ "$failed_at" > "$start" ]; then
                echo "::error::$slug failed: $(jq -r '.lastResult.error // "?"' /tmp/status.json)"
                exit 1
              fi
              skipped_at=$(jq -r '.lastResult.skippedAt // ""' /tmp/status.json)
              if [ -n "$skipped_at" ] && [ "$skipped_at" > "$start" ]; then
                echo "::error::$slug skipped: $(jq -r '.lastResult.reason // "?"' /tmp/status.json)"
                exit 1
              fi
              posted_at=$(jq -r '.lastResult.postedAt // ""' /tmp/status.json)
              if [ -n "$posted_at" ] && [ "$posted_at" > "$start" ]; then
                echo "$slug posted $(jq -r '.lastResult.postId // "?"' /tmp/status.json) — $(jq -r '.lastResult.topic // ""' /tmp/status.json)"
                # Published but unrecorded means the next run can pick the same
                # story again, so it is worth a red run even though it posted.
                if [ "$(jq -r '.lastResult.recorded' /tmp/status.json)" = "false" ]; then
                  echo "::error::$slug published but the URL was NOT recorded in the dedupe history."
                  exit 1
                fi
                ok=1
                break
              fi
              echo "waiting... ($i/45)"
            done
            if [ -z "$ok" ]; then
              echo "::error::Timed out after 15 minutes waiting for $slug."
              cat /tmp/status.json
              exit 1
            fi
            echo "::endgroup::"
          done
